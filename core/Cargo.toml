[package]
name = "magpie-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "magpie_core"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled", "serde_json"] }
fastembed = "6"
reqwest = { version = "0.13", features = ["json", "gzip"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
futures = "0.3"
ignore = "0.4"
# siglip.rs drives these directly; versions pinned to match fastembed's tree
ort = "=2.0.0-rc.13"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
image = "0.25"
ndarray = "0.17"
hf-hub = { version = "0.5", default-features = false, features = ["ureq", "native-tls"] }
ureq = { version = "3.4", default-features = false, features = ["native-tls"] }
base64 = "0.22"
pdf-inspector = "1.15.0"
# deflate-flate2 (miniz_oxide) instead of default zlib-rs: zlib-rs 0.6 hits a
# const-eval ICE on rustc 1.89 under the release LTO profile
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
arboard = "3.6.1"

[target."cfg(windows)".dependencies]
clipboard-win = "5.4.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
