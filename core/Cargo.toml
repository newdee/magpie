[package]
name = "magpie-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "magpie_core"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled", "serde_json"] }
fastembed = "6"
reqwest = { version = "0.13", features = ["json", "gzip"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
futures = "0.3"
ignore = "0.4"
# siglip.rs drives these directly; versions pinned to match fastembed's tree
ort = "=2.0.0-rc.13"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
image = "0.25"
ndarray = "0.17"
hf-hub = { version = "0.5", default-features = false, features = ["ureq", "native-tls"] }
