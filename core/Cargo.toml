[package]
name = "star-recall-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "star_recall_core"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled", "serde_json"] }
fastembed = "6"
reqwest = { version = "0.13", features = ["json", "gzip"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
futures = "0.3"
ignore = "0.4"
