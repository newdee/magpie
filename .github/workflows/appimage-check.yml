name: AppImage check (temporary)

# Throwaway: proves on a real runner, without publishing anything, that an
# AppImage built on the oldest supported Ubuntu LTS with the AppRun seed
# starts for another user on that LTS, the way the AppImage catalog tests it.
# Deleted with its branch.
on:
  push:
    branches: [ci-appimage-check]

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libxdo-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: Core tests on 22.04
        run: cargo test -p magpie-core
      - name: Seed AppRun executable for everyone
        run: |
          mkdir -p ~/.cache/tauri
          curl -fsSL -o ~/.cache/tauri/AppRun-x86_64 \
            https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64
          chmod 755 ~/.cache/tauri/AppRun-x86_64
      - name: Build the AppImage and deb
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles appimage,deb
      - name: Check every program in the AppImage runs for any user
        run: |
          set -euo pipefail
          img=$(ls "$PWD"/target/release/bundle/appimage/*.AppImage)
          cd "$(mktemp -d)"
          "$img" --appimage-extract >/dev/null
          ls -la squashfs-root/AppRun squashfs-root/AppRun.wrapped
          test -x squashfs-root/AppRun.wrapped
          bad=$(find squashfs-root -type f -perm -u+x ! -perm -o+x)
          if [ -n "$bad" ]; then
            echo "::error::executable for its owner only: $bad"
            exit 1
          fi
          echo "every program in the AppImage is executable by everyone"
          echo "newest glibc symbol the binary needs:"
          objdump -T squashfs-root/usr/bin/magpie | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
      - name: Start it as another user on a virtual display, as the catalog does
        run: |
          set -uo pipefail
          img=$(ls "$PWD"/target/release/bundle/appimage/*.AppImage)
          d=$(mktemp -d); cp "$img" "$d/m.AppImage"; chmod 755 "$d" "$d/m.AppImage"
          cd "$d"; ./m.AppImage --appimage-extract >/dev/null
          sudo chown -R root:root squashfs-root
          sudo -u nobody env HOME=/tmp/nobody-home xvfb-run -a timeout 20 ./squashfs-root/AppRun > run.log 2>&1
          code=$?
          echo "exit code: $code (124 = still running after 20 s, which is what we want)"
          head -40 run.log
          test "$code" = 124
