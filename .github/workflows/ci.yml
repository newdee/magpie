name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libxdo-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Core tests
        run: cargo test -p magpie-core

      - name: Clippy (deny warnings)
        run: cargo clippy -p magpie-core -p magpie --all-targets -- -D warnings

      - uses: pnpm/action-setup@v4
        with:
          # Match the pnpm major used to generate pnpm-lock.yaml and
          # pnpm-workspace.yaml (config-only workspace files need >= 10).
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Frontend type-check + build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

  # macOS-only code (AppKit app icons, the main-thread key chord) never
  # compiles on the Linux job above; this one builds it and runs the icon
  # reader on a real Mac, on the main thread as the app does
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Clippy (deny warnings)
        run: cargo clippy -p magpie-core -p magpie --all-targets -- -D warnings

      - name: App icons through AppKit
        run: cargo test -p magpie-core --test app_icons_main

      # magpie reads app icons on background threads; Apple's Main Thread
      # Checker must find nothing in that, and must catch the control case
      # (proof that it was loaded at all)
      - name: App icons off the main thread, under the Main Thread Checker
        run: |
          bin=$(cargo test -p magpie-core --test app_icons_main --no-run --message-format=json \
            | jq -r 'select(.executable != null and .target.name == "app_icons_main") | .executable')
          mtc="$(xcode-select -p)/usr/lib/libMainThreadChecker.dylib"
          test -f "$mtc"
          DYLD_INSERT_LIBRARIES="$mtc" MTC_CRASH_ON_REPORT=1 "$bin"
          if DYLD_INSERT_LIBRARIES="$mtc" MTC_CRASH_ON_REPORT=1 MAGPIE_MTC_CONTROL=1 "$bin"; then
            echo "the Main Thread Checker did not catch the control case"; exit 1
          fi
          echo "control case caught, as it should be"
