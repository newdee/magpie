name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libxdo-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Core tests
        run: cargo test -p magpie-core

      - name: Clippy (deny warnings)
        run: cargo clippy -p magpie-core -p magpie --all-targets -- -D warnings

      - uses: pnpm/action-setup@v4
        with:
          # Match the pnpm major used to generate pnpm-lock.yaml and
          # pnpm-workspace.yaml (config-only workspace files need >= 10).
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Frontend type-check + build
        run: |
          pnpm install --frozen-lockfile
          pnpm build
