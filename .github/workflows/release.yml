name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest # Apple Silicon; ort has no x86_64 cross-link
            args: ""
          # the oldest supported LTS: what is built here runs there and later
          # (ONNX Runtime comes from Microsoft's build, see onnx.rs)
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libxdo-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - uses: dtolnay/rust-toolchain@stable

      # keyed by the image: C objects built against one glibc's headers do
      # not link against an older one (24.04's cache broke the 22.04 build)
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.platform }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      - name: Run core tests
        run: cargo test -p magpie-core

      # Notarization credentials must be ABSENT (not empty) when unset:
      # tauri only checks that APPLE_ID/APPLE_PASSWORD exist, so an empty
      # string makes it call Apple with blank credentials and die on 401.
      - name: Enable notarization when credentials are configured
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          if [ -n "${{ secrets.APPLE_ID }}" ] && [ -n "${{ secrets.APPLE_PASSWORD }}" ]; then
            {
              echo "APPLE_ID=${{ secrets.APPLE_ID }}"
              echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
              echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
            } >> "$GITHUB_ENV"
          else
            echo "notarization credentials not set; signing only"
          fi

      # The bundler caches AppRun with mode 0770 and copies it, mode and all,
      # into the AppImage as AppRun.wrapped; mounted under another owner
      # (firejail, the AppImage catalog's test, shared installs) it then
      # fails with "Permission denied" (tauri-apps/tauri#16155). It skips the
      # download when the file is already cached, so seed it 0755.
      - name: Seed AppRun executable for everyone
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p ~/.cache/tauri
          curl -fsSL -o ~/.cache/tauri/AppRun-x86_64 \
            https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64
          chmod 755 ~/.cache/tauri/AppRun-x86_64

      - name: ONNX Runtime for the Linux bundles
        if: matrix.platform == 'ubuntu-22.04'
        run: scripts/fetch-onnxruntime.sh

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing (the action skips import while these are
          # empty). A stable Developer ID identity keeps TCC folder
          # permissions across updates — ad-hoc builds reset them every time.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "magpie ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # The draft is already uploaded by now; failing here fails the run, and
      # a failed run is not published. Catches the seed above going stale.
      - name: Check every program in the AppImage runs for any user
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -euo pipefail
          img=$(ls "$PWD"/target/release/bundle/appimage/*.AppImage)
          cd "$(mktemp -d)"
          "$img" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun.wrapped
          bad=$(find squashfs-root -type f -perm -u+x ! -perm -o+x)
          if [ -n "$bad" ]; then
            echo "::error::executable for its owner only: $bad"
            exit 1
          fi
          echo "every program in the AppImage is executable by everyone"

      # Ubuntu 22.04 has glibc 2.35: nothing inside may ask for more, and the
      # ONNX Runtime the app loads must be there
      - name: Check the AppImage runs on Ubuntu 22.04
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -euo pipefail
          img=$(ls "$PWD"/target/release/bundle/appimage/*.AppImage)
          cd "$(mktemp -d)"
          "$img" --appimage-extract >/dev/null
          test -f squashfs-root/usr/lib/magpie/libonnxruntime.so
          # the system's libwayland-client, never a bundled one: the copy from
          # 22.04 kept the window from coming up on Arch, EGL_BAD_PARAMETER
          # (#15). tauri-cli 2.12 bundles with a linuxdeploy that leaves it out
          wl=$(find squashfs-root -name 'libwayland-client*')
          if [ -n "$wl" ]; then
            echo "::error::libwayland-client is bundled: $wl"
            exit 1
          fi
          newest=$(find squashfs-root -type f -exec sh -c 'file -b "$1" | grep -q ^ELF && objdump -T "$1" 2>/dev/null' _ {} \; \
            | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "newest glibc symbol in the AppImage: $newest"
          if [ "$(printf '%s\nGLIBC_2.35\n' "$newest" | sort -V | tail -1)" != "GLIBC_2.35" ]; then
            echo "::error::the AppImage needs $newest, newer than Ubuntu 22.04's glibc 2.35"
            exit 1
          fi

  test:
    # PR / push safety net without producing a release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: cargo test -p magpie-core
